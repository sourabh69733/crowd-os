<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .title { font: 700 42px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #59657a; }
      .box { fill: #ffffff; stroke: #8e9bb0; stroke-width: 2; }
      .source { fill: #e8f2ff; stroke: #3478c7; }
      .secure { fill: #f3eefe; stroke: #7654b5; }
      .relay { fill: #eef8ed; stroke: #4f8d57; }
      .gateway { fill: #fff3de; stroke: #b77a19; }
      .server { fill: #ffeceb; stroke: #b85450; }
      .label { font: 700 21px Arial, sans-serif; fill: #172033; text-anchor: middle; }
      .small { font: 400 17px Arial, sans-serif; fill: #445067; text-anchor: middle; }
      .step { font: 700 17px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
      .step-bg { fill: #172033; }
      .arrow { fill: none; stroke: #546176; stroke-width: 4; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 11 8; }
      .caption { font: 400 19px Arial, sans-serif; fill: #445067; text-anchor: middle; }
      .limit { fill: #fff8e8; stroke: #b77a19; stroke-width: 2; }
      .limit-title { font: 700 21px Arial, sans-serif; fill: #8a5a10; }
      .limit-text { font: 400 18px Arial, sans-serif; fill: #55462f; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#546176"/>
    </marker>
  </defs>

  <rect class="bg" width="1800" height="980"/>
  <text class="title" x="90" y="78">CrowdOS Offline Message Delivery</text>
  <text class="subtitle" x="90" y="116">Every message is signed, encrypted when sensitive, stored locally, and relayed opportunistically</text>

  <circle class="step-bg" cx="175" cy="210" r="25"/><text class="step" x="175" y="216">1</text>
  <circle class="step-bg" cx="500" cy="210" r="25"/><text class="step" x="500" y="216">2</text>
  <circle class="step-bg" cx="825" cy="210" r="25"/><text class="step" x="825" y="216">3</text>
  <circle class="step-bg" cx="1150" cy="210" r="25"/><text class="step" x="1150" y="216">4</text>
  <circle class="step-bg" cx="1475" cy="210" r="25"/><text class="step" x="1475" y="216">5</text>

  <rect class="box source" x="65" y="260" width="260" height="125" rx="8"/>
  <text class="label" x="195" y="305">Create Message</text>
  <text class="small" x="195" y="337">SOS, alert, report</text>
  <text class="small" x="195" y="365">or volunteer update</text>

  <rect class="box secure" x="390" y="260" width="260" height="125" rx="8"/>
  <text class="label" x="520" y="305">Protect</text>
  <text class="small" x="520" y="337">sign + encrypt</text>
  <text class="small" x="520" y="365">add expiry + message ID</text>

  <rect class="box secure" x="715" y="260" width="260" height="125" rx="8"/>
  <text class="label" x="845" y="305">Local Queue</text>
  <text class="small" x="845" y="337">persist until confirmed</text>
  <text class="small" x="845" y="365">priority + retry policy</text>

  <rect class="box relay" x="1040" y="260" width="260" height="125" rx="8"/>
  <text class="label" x="1170" y="305">Nearby Relay</text>
  <text class="small" x="1170" y="337">deduplicate + forward</text>
  <text class="small" x="1170" y="365">cannot alter payload</text>

  <rect class="box gateway" x="1365" y="260" width="260" height="125" rx="8"/>
  <text class="label" x="1495" y="305">Gateway / Server</text>
  <text class="small" x="1495" y="337">sync when reachable</text>
  <text class="small" x="1495" y="365">return delivery receipt</text>

  <path class="arrow" d="M325 322 H380"/>
  <path class="arrow" d="M650 322 H705"/>
  <path class="arrow" d="M975 322 H1030"/>
  <path class="arrow dashed" d="M1300 322 H1355"/>

  <text class="caption" x="1170" y="430">Repeats across nearby phones</text>
  <text class="caption" x="1495" y="430">Only this hop needs internet</text>

  <path class="arrow" d="M1495 385 V500 H845 V395"/>
  <text class="caption" x="1170" y="532">Receipt clears acknowledged copies; expired messages are discarded</text>

  <rect class="box server" x="235" y="590" width="1330" height="115" rx="8"/>
  <text class="label" x="900" y="632">Priority Order</text>
  <text class="small" x="900" y="670">Emergency SOS → verified safety alert → operational task → normal report</text>

  <rect class="limit" x="235" y="755" width="1330" height="155" rx="8"/>
  <text class="limit-title" x="275" y="802">Physical limitation</text>
  <text class="limit-text" x="275" y="842">Coverage depends on enough participating phones forming a chain. Bluetooth range is usually tens of metres, not 1.5 km.</text>
  <text class="limit-text" x="275" y="875">No connected gateway means CrowdOS messages still move locally, but general web browsing and internet services remain unavailable.</text>
</svg>
