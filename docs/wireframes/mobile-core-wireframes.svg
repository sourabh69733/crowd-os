<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1900" viewBox="0 0 2400 1900">
  <defs>
    <style>
      .bg { fill: #f4f4f2; }
      .board-title { font: 700 44px Arial, sans-serif; fill: #151515; }
      .board-sub { font: 400 23px Arial, sans-serif; fill: #5f5f5f; }
      .phone { fill: #fff; stroke: #1e1e1e; stroke-width: 4; }
      .divider { stroke: #c8c8c8; stroke-width: 2; }
      .box { fill: #fafafa; stroke: #777; stroke-width: 2; }
      .strong-box { fill: #e9e9e7; stroke: #222; stroke-width: 3; }
      .emergency { fill: #2d2d2d; stroke: #111; stroke-width: 3; }
      .map { fill: #efefec; stroke: #777; stroke-width: 2; }
      .map-line { fill: none; stroke: #9a9a9a; stroke-width: 6; }
      .map-line-strong { fill: none; stroke: #333; stroke-width: 8; }
      .pin { fill: #fff; stroke: #222; stroke-width: 3; }
      .title { font: 700 29px Arial, sans-serif; fill: #161616; }
      .heading { font: 700 22px Arial, sans-serif; fill: #202020; }
      .body { font: 400 18px Arial, sans-serif; fill: #444; }
      .small { font: 400 15px Arial, sans-serif; fill: #666; }
      .button { font: 700 19px Arial, sans-serif; fill: #202020; text-anchor: middle; }
      .button-light { font: 700 19px Arial, sans-serif; fill: #fff; text-anchor: middle; }
      .center { text-anchor: middle; }
      .nav { font: 400 14px Arial, sans-serif; fill: #555; text-anchor: middle; }
      .nav-active { font: 700 14px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .icon { fill: none; stroke: #333; stroke-width: 3; }
      .dot { fill: #333; }
      .muted-dot { fill: #aaa; }
    </style>
  </defs>

  <rect class="bg" width="2400" height="1900"/>
  <text class="board-title" x="100" y="82">CrowdOS Mobile: Core Wireframes</text>
  <text class="board-sub" x="100" y="120">Structure and emergency workflows for review before visual design</text>

  <!-- 1. Join Event -->
  <text class="heading" x="100" y="178">01  Join Event</text>
  <rect class="phone" x="100" y="205" width="650" height="760" rx="34"/>
  <rect x="340" y="222" width="170" height="18" rx="9" fill="#222"/>
  <text class="small" x="140" y="275">CrowdOS</text>
  <text class="title" x="140" y="335">Join a verified event</text>
  <text class="body" x="140" y="371">Scan the organizer QR code to load</text>
  <text class="body" x="140" y="397">offline plans and trusted signing keys.</text>
  <rect class="strong-box" x="225" y="445" width="400" height="245" rx="8"/>
  <path class="icon" d="M320 510 h45 v45 h-45 z M485 510 h45 v45 h-45 z M320 615 h45 v45 h-45 z"/>
  <path class="icon" d="M405 520 h35 v35 h-35 z M470 590 h28 v28 h-28 z M405 635 h30 v25 h-30 z"/>
  <text class="heading center" x="425" y="725">Scan event QR</text>
  <rect class="box" x="140" y="760" width="470" height="58" rx="6"/>
  <text class="body" x="165" y="797">Enter invite code</text>
  <rect class="emergency" x="140" y="840" width="470" height="70" rx="6"/>
  <text class="button-light" x="375" y="883">Continue securely</text>
  <text class="small center" x="425" y="940">Language: English  ·  हिन्दी</text>

  <!-- 2. Home -->
  <text class="heading" x="875" y="178">02  Home</text>
  <rect class="phone" x="875" y="205" width="650" height="760" rx="34"/>
  <rect x="1115" y="222" width="170" height="18" rx="9" fill="#222"/>
  <text class="small" x="915" y="275">CJP PILOT EVENT</text>
  <text class="title" x="915" y="322">Safety status</text>
  <rect class="strong-box" x="915" y="350" width="570" height="85" rx="7"/>
  <circle class="dot" cx="950" cy="392" r="9"/>
  <text class="heading" x="975" y="388">Offline relay active</text>
  <text class="small" x="975" y="414">3 nearby peers · 1 message pending</text>
  <text class="heading" x="915" y="485">Emergency help</text>
  <rect class="emergency" x="915" y="510" width="270" height="92" rx="7"/>
  <text class="button-light" x="1050" y="562">Medical SOS</text>
  <rect class="emergency" x="1215" y="510" width="270" height="92" rx="7"/>
  <text class="button-light" x="1350" y="562">Other SOS</text>
  <text class="heading" x="915" y="650">Latest verified alert</text>
  <rect class="box" x="915" y="675" width="570" height="130" rx="7"/>
  <text class="heading" x="945" y="716">Route update</text>
  <text class="body" x="945" y="750">North gate is crowded. Use the</text>
  <text class="body" x="945" y="777">marked south exit. · 2 min ago</text>
  <line class="divider" x1="875" y1="845" x2="1525" y2="845"/>
  <text class="nav-active" x="940" y="895">Home</text>
  <text class="nav" x="1070" y="895">Alerts</text>
  <text class="nav" x="1200" y="895">Map</text>
  <text class="nav" x="1330" y="895">Report</text>
  <text class="nav" x="1460" y="895">Network</text>

  <!-- 3. SOS -->
  <text class="heading" x="1650" y="178">03  SOS</text>
  <rect class="phone" x="1650" y="205" width="650" height="760" rx="34"/>
  <rect x="1890" y="222" width="170" height="18" rx="9" fill="#222"/>
  <text class="small" x="1690" y="275">←  BACK</text>
  <text class="title" x="1690" y="325">What help is needed?</text>
  <text class="body" x="1690" y="361">Choose one. Critical requests are sent first.</text>
  <rect class="emergency" x="1690" y="410" width="270" height="95" rx="7"/>
  <text class="button-light" x="1825" y="465">Doctor</text>
  <rect class="strong-box" x="1990" y="410" width="270" height="95" rx="7"/>
  <text class="button" x="2125" y="465">Evacuation</text>
  <rect class="strong-box" x="1690" y="535" width="270" height="95" rx="7"/>
  <text class="button" x="1825" y="590">Legal support</text>
  <rect class="strong-box" x="1990" y="535" width="270" height="95" rx="7"/>
  <text class="button" x="2125" y="590">Water / supplies</text>
  <text class="heading" x="1690" y="682">Location and note</text>
  <rect class="box" x="1690" y="707" width="570" height="58" rx="6"/>
  <text class="body" x="1718" y="744">Gate 3 · GPS accuracy 18 m</text>
  <rect class="box" x="1690" y="785" width="570" height="70" rx="6"/>
  <text class="body" x="1718" y="824">Short note (optional)</text>
  <rect class="emergency" x="1690" y="875" width="570" height="62" rx="6"/>
  <text class="button-light" x="1975" y="914">Hold 2 seconds to send SOS</text>

  <!-- 4. Alerts -->
  <text class="heading" x="100" y="1025">04  Verified Alerts</text>
  <rect class="phone" x="100" y="1050" width="650" height="760" rx="34"/>
  <rect x="340" y="1067" width="170" height="18" rx="9" fill="#222"/>
  <text class="small" x="140" y="1120">CJP PILOT EVENT</text>
  <text class="title" x="140" y="1167">Verified alerts</text>
  <rect class="strong-box" x="140" y="1205" width="570" height="155" rx="7"/>
  <circle class="dot" cx="175" cy="1245" r="9"/>
  <text class="heading" x="200" y="1251">Important route update</text>
  <text class="body" x="170" y="1291">North gate is crowded. Move toward</text>
  <text class="body" x="170" y="1318">the south exit. · Signed · 2 min</text>
  <rect class="box" x="140" y="1380" width="570" height="145" rx="7"/>
  <circle class="dot" cx="175" cy="1420" r="9"/>
  <text class="heading" x="200" y="1426">Medical point active</text>
  <text class="body" x="170" y="1466">First-aid desk is open near Gate 3.</text>
  <text class="body" x="170" y="1493">Signed · 8 min ago</text>
  <rect class="box" x="140" y="1545" width="570" height="115" rx="7"/>
  <circle class="muted-dot" cx="175" cy="1585" r="9"/>
  <text class="heading" x="200" y="1591">Water point update</text>
  <text class="body" x="170" y="1631">Cached offline · 21 min ago</text>
  <line class="divider" x1="100" y1="1690" x2="750" y2="1690"/>
  <text class="nav" x="165" y="1740">Home</text>
  <text class="nav-active" x="295" y="1740">Alerts</text>
  <text class="nav" x="425" y="1740">Map</text>
  <text class="nav" x="555" y="1740">Report</text>
  <text class="nav" x="685" y="1740">Network</text>

  <!-- 5. Offline Map -->
  <text class="heading" x="875" y="1025">05  Offline Map</text>
  <rect class="phone" x="875" y="1050" width="650" height="760" rx="34"/>
  <rect x="1115" y="1067" width="170" height="18" rx="9" fill="#222"/>
  <text class="title" x="915" y="1130">Offline safety map</text>
  <text class="small" x="915" y="1160">Map downloaded · updated 12 min ago</text>
  <rect class="map" x="915" y="1190" width="570" height="440" rx="7"/>
  <path class="map-line" d="M930 1280 C1030 1240 1120 1295 1210 1260 S1390 1210 1470 1265"/>
  <path class="map-line" d="M960 1510 C1080 1460 1170 1515 1280 1475 S1390 1420 1460 1460"/>
  <path class="map-line-strong" d="M970 1580 C1050 1510 1120 1445 1190 1390 S1330 1300 1430 1230"/>
  <circle class="pin" cx="1050" cy="1510" r="18"/>
  <text class="small center" x="1050" y="1516">M</text>
  <circle class="pin" cx="1250" cy="1345" r="18"/>
  <text class="small center" x="1250" y="1351">W</text>
  <circle class="pin" cx="1400" cy="1255" r="18"/>
  <text class="small center" x="1400" y="1261">E</text>
  <circle class="dot" cx="1165" cy="1415" r="12"/>
  <text class="small" x="1185" y="1421">You</text>
  <rect class="strong-box" x="915" y="1650" width="570" height="72" rx="7"/>
  <text class="heading" x="945" y="1682">Nearest safe exit: South</text>
  <text class="small" x="945" y="1707">Approx. 6 min walking · cached route</text>
  <line class="divider" x1="875" y1="1740" x2="1525" y2="1740"/>
  <text class="nav" x="940" y="1785">Home</text>
  <text class="nav" x="1070" y="1785">Alerts</text>
  <text class="nav-active" x="1200" y="1785">Map</text>
  <text class="nav" x="1330" y="1785">Report</text>
  <text class="nav" x="1460" y="1785">Network</text>

  <!-- 6. Nearby Network -->
  <text class="heading" x="1650" y="1025">06  Nearby Network</text>
  <rect class="phone" x="1650" y="1050" width="650" height="760" rx="34"/>
  <rect x="1890" y="1067" width="170" height="18" rx="9" fill="#222"/>
  <text class="title" x="1690" y="1130">Nearby network</text>
  <rect class="strong-box" x="1690" y="1170" width="570" height="105" rx="7"/>
  <circle class="dot" cx="1730" cy="1210" r="10"/>
  <text class="heading" x="1755" y="1217">Relaying offline</text>
  <text class="small" x="1755" y="1245">Bluetooth + local Wi-Fi active</text>
  <text class="heading" x="1690" y="1325">Delivery status</text>
  <rect class="box" x="1690" y="1350" width="270" height="115" rx="7"/>
  <text class="small center" x="1825" y="1388">NEARBY PEERS</text>
  <text class="title center" x="1825" y="1435">3</text>
  <rect class="box" x="1990" y="1350" width="270" height="115" rx="7"/>
  <text class="small center" x="2125" y="1388">PENDING</text>
  <text class="title center" x="2125" y="1435">1</text>
  <text class="heading" x="1690" y="1515">Recent messages</text>
  <rect class="box" x="1690" y="1540" width="570" height="78" rx="7"/>
  <circle class="dot" cx="1725" cy="1579" r="8"/>
  <text class="body" x="1750" y="1578">Medical SOS · pending</text>
  <text class="small" x="1750" y="1602">Will relay automatically · 20 sec</text>
  <rect class="box" x="1690" y="1638" width="570" height="78" rx="7"/>
  <circle class="muted-dot" cx="1725" cy="1677" r="8"/>
  <text class="body" x="1750" y="1676">Route alert · delivered</text>
  <text class="small" x="1750" y="1700">Received from nearby peer · 3 min</text>
  <line class="divider" x1="1650" y1="1740" x2="2300" y2="1740"/>
  <text class="nav" x="1715" y="1785">Home</text>
  <text class="nav" x="1845" y="1785">Alerts</text>
  <text class="nav" x="1975" y="1785">Map</text>
  <text class="nav" x="2105" y="1785">Report</text>
  <text class="nav-active" x="2235" y="1785">Network</text>
</svg>
